<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">More runner workers only help until QPS runs out</title><desc id="d">Kubernetes writes per second against EphemeralRunner workers from 0 to 64, for client QPS of 20, 50 and 100. Each line rises at about 2 writes per second per worker, then flattens at its QPS: 20 QPS flattens near 10 workers, 50 near 25 and 100 near 50. 64 workers at 20 QPS gets about 20 writes per second; 16 workers at 50 QPS gets about 31.</desc>
