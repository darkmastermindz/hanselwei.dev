<title id="t">Scale-down latency ≈ max(delay, sync period)</title><desc id="d">Effective scale-down latency in minutes against sync period from 0 to 10 minutes, for scale-down delays of 1 and 5 minutes. Each line is flat at its delay until the sync period passes it, then rises with the sync period: with a 1 minute delay and a 10 minute sync period, scale-down takes about 10 minutes.</desc>
