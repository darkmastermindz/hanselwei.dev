<title id="t">GitHub budget: runner transitions per minute</title><desc id="d">Runner transitions per minute that a GitHub token can sustain against GitHub API calls per transition from 1 to 6. A personal access token (5,000 requests an hour) allows about 83 a minute at 1 call and 28 at 3 calls; a GitHub App (15,000 an hour) allows 250 at 1 call and 83 at 3 calls.</desc>
