[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"
  NITRO_PRESET = "static"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Old route kept working for existing links
[[redirects]]
  from = "/gearClimbing"
  to = "/gear/outdoor#climbing"
  status = 301

[[redirects]]
  from = "/gear/climbing"
  to = "/gear/outdoor#climbing"
  status = 301

[[redirects]]
  from = "/gear/video"
  to = "/gear/camera"
  status = 301

# Contact card: only linked after the human check on the home page,
# and disallowed for crawlers in public/robots.txt
[[redirects]]
  from = "/connect"
  to = "https://hansel.run/connect"
  status = 302

# Security headers for every response. The Content-Security-Policy is generated per
# build into .output/public/_headers (scripts/build-csp.mjs) because it pins the hashes
# of Nuxt's inline scripts. tests/security/headers.test.mjs keeps these from being dropped.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), browsing-topics=()"
    # Sign-in popups and links opened in new tabs keep working
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[plugins]]
  package = "@netlify/plugin-lighthouse"
