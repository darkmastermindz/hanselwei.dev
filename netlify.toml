[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"
  NITRO_PRESET = "static"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Old route kept working for existing links
[[redirects]]
  from = "/gearClimbing"
  to = "/gear/outdoor#climbing"
  status = 301

[[redirects]]
  from = "/gear/climbing"
  to = "/gear/outdoor#climbing"
  status = 301

[[redirects]]
  from = "/gear/video"
  to = "/gear/camera"
  status = 301

# The home page coin's photos (utils/coinFaces.mjs) go through Netlify's Image CDN, resized and
# sent as WebP/AVIF. Only these two images can be fetched through it, so it isn't an open proxy
# (tests/security/headers.test.mjs).
[images]
  remote_images = [
    'https://avatars\.githubusercontent\.com/u/6164335\?.*',
    'https://1\.gravatar\.com/avatar/821b2e292cc6a6668358a74625d89a477f395929456bf9f30db01c059de56fd2\?.*'
  ]

# Contact card: only linked after the human check on the home page,
# and disallowed for crawlers in public/robots.txt
[[redirects]]
  from = "/connect"
  to = "https://hansel.run/connect"
  status = 302

# Security headers for every response. The Content-Security-Policy is generated per
# build into .output/public/_headers (scripts/build-csp.mjs) because it pins the hashes
# of Nuxt's inline scripts. tests/security/headers.test.mjs keeps these from being dropped.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), browsing-topics=()"
    # Sign-in popups and links opened in new tabs keep working
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Sign-in and who's signed in are never cached
[[headers]]
  for = "/api/me"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/api/auth/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[plugins]]
  package = "@netlify/plugin-lighthouse"
