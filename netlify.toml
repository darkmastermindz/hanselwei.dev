[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"
  NITRO_PRESET = "static"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Old route kept working for existing links
[[redirects]]
  from = "/gearClimbing"
  to = "/gear/outdoor#climbing"
  status = 301

[[redirects]]
  from = "/gear/climbing"
  to = "/gear/outdoor#climbing"
  status = 301

[[redirects]]
  from = "/gear/video"
  to = "/gear/camera"
  status = 301

# Contact card: only linked after the human check on the home page,
# and disallowed for crawlers in public/robots.txt
[[redirects]]
  from = "/connect"
  to = "https://hansel.run/connect"
  status = 302

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[plugins]]
  package = "@netlify/plugin-lighthouse"
