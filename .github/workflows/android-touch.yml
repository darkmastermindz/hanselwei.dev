# Touch scrolling on every Android phone, tablet and foldable Playwright knows (tests/e2e), against
# the generated site, with a phantom "controller" like the ones Android phones report. Runs when
# anything that reaches the page changes, split across four runners.
name: Android touch
on:
  pull_request:
    paths:
      - 'components/**'
      - 'composables/**'
      - 'layouts/**'
      - 'pages/**'
      - 'plugins/**'
      - 'utils/**'
      - 'assets/**'
      - 'public/**'
      - 'app.vue'
      - 'nuxt.config.js'
      - 'tailwind.config.js'
      - 'config.toml'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'tests/e2e/**'
      - 'scripts/serve-static.mjs'
      - '.github/workflows/android-touch.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-touch:
    name: Android touch (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Third-party actions are pinned to full commit SHAs (Dependabot keeps them current)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # Builds the site the way Netlify does (pregenerate runs the unit and security tests too)
      - run: npm run generate
      - run: npx playwright test --shard=${{ matrix.shard }}/4
